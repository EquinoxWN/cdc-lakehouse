# Starts the full stack with Docker Compose and proves Postgres changes reach Kafka as Avro events.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with stream extras
        run: python -m pip install -e ".[stream]"
      - name: Start stack
        run: docker compose up -d --wait postgres kafka registry && docker compose up -d connect
      - name: Wait for Kafka Connect
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8083/ >/dev/null && exit 0; sleep 3; done
          docker compose logs connect | tail -100; exit 1
      - name: End-to-end check
        run: python -m cdc_lakehouse.e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
